name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze
      - run: flutter analyze
        working-directory: example
      - name: Dry-run package validation
        run: |
          if ! grep -Eq '^publish_to:\s*none\s*$' pubspec.yaml; then
            flutter pub publish --dry-run --ignore-warnings
          else
            echo "Skipping pub.dev validation dry-run because publish_to: none is set."
          fi
