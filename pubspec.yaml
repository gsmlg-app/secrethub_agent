name: secrethub_agent
description: SecretHub mobile agent plugin bootstrap for iOS and Android.
version: 0.0.1
publish_to: none
repository: https://github.com/gsmlg-app/secrethub_agent

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.gsmlg.secrethub_agent
        pluginClass: SecrethubAgentPlugin
      ios:
        pluginClass: SecrethubAgentPlugin
